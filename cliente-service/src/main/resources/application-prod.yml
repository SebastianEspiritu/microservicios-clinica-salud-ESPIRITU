server:
  port: 9091

spring:
  datasource:
    url: jdbc:mysql://servidor/bd_cliente
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

empresa:
  ambiente: produccion

# Configuracion Eureka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://servidor:8761/eureka
