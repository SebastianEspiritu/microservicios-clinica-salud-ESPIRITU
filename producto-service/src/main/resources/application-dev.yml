server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bd_producto_dev?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

empresa:
  ambiente: desarrollo

# Configuracion Eureka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
